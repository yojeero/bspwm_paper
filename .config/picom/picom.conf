
backend = "glx";
vsync = true;

use-damage = true;
unredir-if-possible = true;

fading = true;
fade-in-step = 0.05;  
fade-out-step = 0.05;
fade-delta = 6;        

shadow = true;
shadow-radius = 16;    
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-opacity = 0.12;

shadow-exclude = [
    "window_type = 'desktop'",
    "_GTK_FRAME_EXTENTS@:c"
];

blur: {
    method = "dual_kawase";
    strength = 3;  
    background = true;
    background-frame = false;
    background-fixed = false;    
};

blur-background-exclude = [
    "window_type = 'desktop'",
    "window_type = 'dock'",       
    "_GTK_FRAME_EXTENTS@:c"
];

corner-radius = 12;
round-borders = 1;
rounded-corners-exclude = [
    "window_type = 'desktop'",
    "window_type = 'dock'"
];

wintypes:
{
  tooltip = { fade = true; shadow = false; opacity = 0.85; focus = true; };
  dock = { shadow = false; clip-shadow-above = true; }
  dnd = { shadow = false; }
  popup_menu = { opacity = 0.95; shadow = false; blur-background = false; }
  dropdown_menu = { opacity = 0.95; shadow = false; blur-background = false; }
};
